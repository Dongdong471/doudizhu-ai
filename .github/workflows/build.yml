name: Build DoudizhuAI IPA

# 云端 macOS 机器自带 Xcode，编译出 .ipa 供 AltStore 侧载。
# 使用方法：GitHub 仓库 → Actions → 本工作流 → Run workflow → 下载产物 DoudizhuAI.ipa

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build (unsigned, for sideload)
        run: |
          set -e
          xcodebuild \
            -project DoudizhuAI.xcodeproj \
            -target DoudizhuAI \
            -configuration Release \
            -sdk iphoneos \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -e
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "DoudizhuAI.app" -path "*Release-iphoneos*" | head -1)
          echo "App found: $APP"
          test -n "$APP" && test -d "$APP"
          test -d "$APP/PlugIns/DoudizhuAIBroadcast.appex" && echo "Broadcast extension embedded OK"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DoudizhuAI.ipa Payload
          ls -lh DoudizhuAI.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DoudizhuAI.ipa
          path: DoudizhuAI.ipa
          if-no-files-found: error

